# tpf2_bridge_mp.cfg -- settings for tpf2_bridge_mp.dll, the command replication
# bridge. The DLL reads the copy next to itself (the game folder, where the
# installer puts this file) first, then %LOCALAPPDATA%\tpf2mp\data\ if no copy
# exists here, then built-in defaults. Lines starting with # are comments; a
# setting is only recognised as "key=value" at the start of its own line.

# UDP port this instance listens on for the peer bridge.
local_port=7771
# Address and UDP port of the peer bridge. 127.0.0.1 is the two-instances-on-one-
# machine test setup; for a remote peer, put its address here.
peer_ip=127.0.0.1
peer_port=7772
# Which side of the pair this game is: a, b, or auto. auto picks from which local
# port is still free, so two instances on one machine sort themselves out.
instance=auto

# TCP port used for the save-file transfer between the bridges.
xfer_port=7871
# 1 = the joining instance pulls the host's save from the bridge on startup.
# 0 = leave the save transfer to the lobby (netpunch), which is the normal path.
auto_pull=0

# Native per-tick hook on the simulation step; lockstep timing depends on it.
sim_hook=1
# Hook the buy-vehicle command factory so depot purchases can be replicated.
buy_hook=1

# tpf2_bridge_mp.cfg -- settings for tpf2_bridge_mp.dll, the command replication
# bridge. The DLL reads the copy next to itself (the game folder, where the
# installer puts this file) first, then %LOCALAPPDATA%\tpf2mp\data\ if no copy
# exists here, then built-in defaults. Lines starting with # are comments; a
# setting is only recognised as "key=value" at the start of its own line.

# UDP port this instance listens on for the peer bridge.
local_port=7771
# Address and UDP port of the peer. A lobby session sets both itself (this PC and
# the lobby's relay port). With a 127.x address the socket listens on 127.0.0.1
# only; any other address listens on every interface, for a direct link to that
# machine without a lobby. Packets from any other address are dropped either way.
peer_ip=127.0.0.1
peer_port=7772
# Which side of the pair this game is: a, b, or auto. auto picks from which local
# port is still free, so two instances on one machine sort themselves out.
instance=auto

# Legacy save transfer from before the lobby: instance a serves its newest save
# over TCP on xfer_port, and a joiner with auto_pull=1 fetches it at startup.
# 0 = no server; the lobby (netpunch) transfers saves, which is the normal path.
# When on, the server answers peer_ip only (on 127.0.0.1 for a 127.x peer).
save_server=0
xfer_port=7871
# 1 = the joining instance pulls the host's save at startup (the host needs
# save_server=1).
auto_pull=0

# Native per-tick hook on the simulation step; lockstep timing depends on it.
sim_hook=1

# Fractional game speed (2.5x, 0.5x ...): the two GetSpeed calls inside
# GameSim::Step are redirected to a per-frame dither whose average is the
# number in %LOCALAPPDATA%\tpf2mp\data\tpf2_speed.txt (absent or 0 = the
# engine speed). Pacing only; peers stay in step. 0 leaves the calls alone.
speed_hook=1
# Hook the buy-vehicle command factory so depot purchases can be replicated.
buy_hook=1

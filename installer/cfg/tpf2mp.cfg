# tpf2mp.cfg -- the ONE config file for the plugin host and its plugins.
#
# Read from the directory tpf2_pluginhost.dll lives in (the game folder, where
# the installer puts this file), then from %LOCALAPPDATA%\tpf2mp\data\ as a user
# override that survives reinstalls. The FIRST file found wins entirely -- there
# is no merging, so a user override is a complete replacement.
#
# Format:
#   # or ;   comment, but ONLY as the first non-blank character of a line.
#            An inline '#' is part of the value: paths and format strings
#            contain them, and truncating at one silently corrupts them.
#   [name]   section. A plugin's section is its DLL name without ".dll".
#   key=val  whitespace around both sides is trimmed; keys are case-insensitive
#            and matched EXACTLY (no substring matching).
#
# Booleans take 1/0, true/false, yes/no, on/off. An ABSENT key means the
# built-in default, which is not necessarily false -- read each entry below.
#
# The multiplayer DLLs do not read this file. The bridge has no settings, the
# menu reads tpf2_menu_flags.txt next to tpf2_menu.dll, and tpf2_slice.cfg holds
# only optional diagnostics (dumpprop, dump_egeo, exec_delay).

# Plugins shipped by their own installer carry their settings in
#     plugins\<name>.cfg
# beside their DLL (merged over this file, same format, one [section]). That is
# deliberate: two installers must never own one file, or uninstalling either
# clobbers the other. tpf2_bigmap lives in plugins\tpf2_bigmap.cfg, shipped by
# the TpF2 Big Maps package (github.com/silver2127/tpf2-bigmap).

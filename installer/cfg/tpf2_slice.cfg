# tpf2_slice.cfg -- switches for tpf2_slice.dll, which captures a player's own
# build or vehicle command, cancels it locally and hands it to lockstep so every
# peer applies it at the same game time. The DLL reads the copy next to itself
# (the game folder, where the installer puts this file) first, then
# %LOCALAPPDATA%\tpf2mp\data\, then built-in defaults. Lines whose first
# character is # or ; are comments. Every switch is on with =1 and off with =0,
# and the file is re-read on every event, so a change takes effect while the
# game is running.

# enabled: 0 makes the hook completely inert -- no capture, no inject, no cancel;
# the game behaves like plain single player.
enabled=1
# suppress: 1 cancels the player's own build locally after capturing it so it is
# applied only through lockstep (real multiplayer). 0 is observe-and-log: the
# build happens locally as normal AND is still replicated to the peer, which
# leaves the local player with a duplicate -- use 0 only for debugging.
suppress=1
# merge: 1 welds a replayed construction's template street onto the existing
# road it was snapped to on the originating game, so the geometry is identical
# on every peer. 0 leaves the replayed proposal exactly as shipped.
merge=1
# cancel_vehicle: 1 applies strict lockstep to the vehicle commands whose UI
# does not wait for a result (currently reverse-vehicle): the local command is
# cancelled and replayed at the shared time stamp, like a build. 0 runs vehicle
# commands locally at once and replicates them afterwards.
cancel_vehicle=1

# cancel_line: 1 makes assigning a vehicle to a line strict as well -- cancelled
# locally and applied at the shared stamp on every peer -- so a vehicle starts
# its line at the same sim step everywhere. 0 assigns at click time on the
# originator, which leaves that vehicle a fraction of a second ahead there.
cancel_line=1

# Diagnostic: dump every BuildProposal (nodes/segments/removals) to tpf2_slice.log.
# Off in shipped installs -- it is verbose. Set to 1 when investigating a replay
# that the engine rejects without a message; deploy_shipping.ps1 overwrites this
# file, which is how it silently got turned off mid-investigation (2026-08-30).
dumpprop=0

# conx_strict: EXPERIMENTAL. Fixes a station desync where the host's terrain
# grade -- and so the height of the station's track -- differs from the peers'.
# Cause: the host keeps its own native placement while every peer rebuilds the
# station through a scripted proposal, and the two grade the ground differently.
# With this on, the host bulldozes its own copy and rebuilds it the same way the
# peers do, so all instances match; the money is reconciled so you still pay
# once. Constructions that split a road (depots) are left on the native path --
# strict would heal the split and the rebuild would be refused, losing the
# building. ON by default: without it, placing a rail station desyncs the world
# immediately, which is worse than the residual risk that a failed rebuild loses
# that one construction. Set to 0 to keep the old behaviour.
conx_strict=1

# dump_egeo: writes egeo_<instance>.txt (every edge the desync hash sees) next
# to the game exe, for diffing two instances after a divergence. Diagnostic.
#dump_egeo=1

# strict_barrier: EXPERIMENTAL, and the real definition of lockstep. Without it
# the game happily simulates past a step whose command has not arrived yet;
# recovery then applies that command late, which is a genuine divergence that
# merely looks like a save. With it on, the sim STOPS while any command a peer
# says it issued is still missing, and resumes the moment it arrives (pausing
# helps -- the network keeps running while the sim is stopped). It holds through
# the same watchdog as the clock barrier, so a hole that can never be filled
# force-releases after ~11s rather than freezing the game. Off by default
# because tightening this barrier has deadlocked both games before; watch
# "outstanding=" in lockstep_status_<inst>.txt when trying it.
#strict_barrier=1

# road_demolish: replicate BULLDOZING a road or rail edge. Off by default.
#
# Until this existed the bulldozer was capture-only. Every other channel adds or
# edits, and the only removals that crossed the wire were constructions,
# vehicles, lines and stops -- so demolishing a ROAD was a silent local edit.
# The road vanished for the player who did it and stayed forever on every peer,
# which diverges the edge and height lanes on the spot. It reads as a lag
# artifact ("I demolished during lag and the crossing did not form") but lag
# only widens the window in which the player does it; it never replicated at
# any speed.
#
# With this set the bulldoze is CANCELLED locally and replayed from the wire at
# the agreed stamp, so every instance removes the road at the same game-time --
# the same architecture as roads, upgrades, vehicles and lines. The far end
# matches by endpoint POSITION and edge KIND, never by entity id, so a divergent
# id cannot bulldoze the wrong road.
#
# Off by default because a removal is not self-correcting the way an addition
# is: a road that fails to appear is a visible missing road, but a road removed
# on the wrong instance is destroyed work with nothing to rebuild it from. Set
# it on EVERY instance or not at all -- a peer without it ignores the command
# and keeps the road.
# Validated on the three-instance rig 2026-09-03: EXEC EDEMO ... success=true,
# including orphan-node removal. ON by default from here -- a demolish that
# does not replicate is an unconditional desync, which is worse than the risk
# this flag was hedging.
road_demolish=1

# strict_buy: cancel the player's vehicle PURCHASE and replay it at the agreed
# stamp, like every other command. ON by default.
#
# Without it the originator creates the vehicle entity at CLICK time while every
# peer creates it at the stamp, ~3 sim-steps later. That head start is permanent:
# measured 2026-09-03, the host's vehicles ran ahead of both peers with the gap
# plateauing near 37 m, while the two peers -- both replays -- stayed identical
# to each other. purchaseTime, key binding and batch targets were already made
# to agree; this is the timing that was left.
#
# History. BuyVehicle is the one command with a recorded client crash when
# cancelled fire-and-forget (2026-08-28), so it took the build tool's route --
# fire the completion callback, then cancel -- and the fire failed every time
# (2026-09-03), so it was left to run natively. Both are explained: the depot
# window's callback is a heap-allocated std::function whose impl the Add hook
# now resolves through the slot at r9+0x38, and the crash matches the stale
# out-handle fault ZeroAddResult fixed two days later. If a fire still fails
# the cancel is honoured anyway (ARMED 1 was already written), never run on
# top of the replay -- that was the two-vehicles-for-one-click bug.
#
# If a client crashes when buying a vehicle, this is the first thing to turn off.
# Set it on EVERY instance or not at all.
strict_buy=1

# load_gate: hold the game at the loaded save until the other players are in.
# ON by default.
#
# Without it the first instance to finish loading starts simulating alone: the
# barrier deliberately will not hold against silence (correct once a session is
# running, wrong before one has started). Anything done in that window is
# captured, found to have no peer and DROPPED, while the native action still
# happens locally -- so a vehicle bought while the others were still loading
# exists on one instance and no other, and the setLine that follows has nothing
# to bind to on the peers.
#
# It WITHHOLDS the initial unpause rather than commanding speed 0, so it adds no
# new way to stop the simulation. Pressing play is a first-class override, and
# it gives up after K.LOADGATE_MAX_TICKS (~2.8 min) with a loud log rather than
# ever hanging a session.
#load_gate=0
#
# expect_players: how many players this session should have, INCLUDING you.
# With it set the gate waits for exactly that many; without it, it waits for at
# least one peer and then for the count to stop changing. Set it on a fixed rig.
#expect_players=3

# strict_condemo: cancel-and-replay for demolishing a CONSTRUCTION (station,
# depot, asset). The bulldozer's command is cancelled here, the construction's
# file and position are shipped, and EVERY instance -- this one included --
# bulldozes it at the agreed stamp. That puts the refund and the removal of
# waiting passengers on the same sim-step everywhere, which is the coop money
# gap and the "passengers removed at different times" drift from the strict
# demolish ticket. Off, the removal-detection poll ships it after the fact and
# the originator is a few game-units early (the old behaviour).
#
# The cancelled bulldoze fires the tool's completion callback like the road
# path does, so the cursor stays armed; the building vanishes ~0.6 s after the
# click. Matching on replay is EXACT (same file, within 2 m), never nearest.
# Needs suppress=1 and a live session, like every other cancel.
strict_condemo=1

# strict_sell / strict_depot: cancel-and-replay for SellVehicle and
# SendToDepot, the same route as cancel_vehicle's Reverse (fire-and-forget:
# neither UI waits on a result). The originator's command is cancelled, the
# vehicle keys are shipped, and EVERY instance sells / sends at the agreed
# stamp -- the sell refund landing on the same sim-step everywhere was one of
# the coop money-split sources. The Lua replays on the originator only when
# ARMED says the cancel happened, so a cfg with these off stays consistent.
# A batch sell whose keys never bind is LOST everywhere under strict (re-sell
# it) rather than sold on one instance only. Needs suppress=1 and a live
# session.
strict_sell=1
strict_depot=1

# strict_replace: cancel-and-replay for ReplaceVehicle (the vehicle window's
# "replace" / replace-all). Unlike sell and send-to-depot, this UI WAITS on the
# result entity, so it takes the build tool's route: the completion callback is
# fired first, then the command is cancelled, and every instance -- this one
# included -- performs the replacement at the agreed stamp. The new vehicle's
# cross-peer key is bound from each instance's own result, so ids never travel.
# If the callback cannot be fired the cancel is honoured anyway (the Lua has
# already been told ARMED 1); refresh the vehicle window if it looks stale.
strict_replace=1

# strict_line_edit: cancel-and-replay for UpdateLine (stop edits, terminals,
# waiting times) and DeleteLine, the fire-and-forget route like SetLine. The
# new stop list is decoded off the command's own component::Line at the
# factory and shipped as station groups + indices; every instance, this one
# included, applies it at the agreed stamp, so vehicles on the line re-route
# on the same sim-step everywhere. If the decode fails the command is NOT
# cancelled and the old event-only path runs (peers read the line back after
# it applies). CreateLine is never cancelled regardless of this flag.
strict_line_edit=1

# strict_module: cancel-and-replay for modular-station edits and construction
# upgrades (add/remove a module, upgrade a station). The proposal carries the
# old entity and the new ConstructionEntity; its params are walked off the
# proposal (the same walker cancel_construction uses), the native upgrade is
# cancelled, and every instance -- this one included -- upgradeConstruction()s
# the same entity to the same params at the agreed stamp. Detected by SHAPE,
# not by caller, so the module builder is covered without a recorded RVA.
# If the cancel does not land, nothing ships and the edit poll carries the
# native upgrade as before -- an upgrade to identical params is idempotent, so
# there is no double-apply hazard either way.
strict_module=1

# strict_stops: cancel-and-replay for the roadside stop / signal / waypoint tool.
# The placement is decoded off the tool's own proposal (edge, model, name and
# the engine's `left` byte), the native build is cancelled, and every instance
# -- this one included -- rebuilds the edge with the object at the agreed
# stamp. Fixes the poll path's wrong-side signals: a track object's `left` is
# not its model's geometric side, and the poll could only read geometry. A
# placement that REPLACES a stop is not cancelled (the engine re-points its
# lines, which a script proposal cannot) and stays on the poll path. BULLDOZING
# a stop or signal is strict too: the removed object is named off the
# bulldozer's proposal and every instance removes it at the stamp (the poll
# path removed it here at click time and on the peers two steps later, which
# split the people sim, 2026-09-08). If a decode fails nothing is cancelled
# and the poll ships the native result as before.
strict_stops=1

# exec_delay: how far ahead every command is stamped, in game units (snapped up
# to the 0.2 sim-step grid). This IS the felt latency of every strict action.
# 0.6 = three steps, ~0.66 s at speed 1 (absent = 0.6): the shipped default,
# with margin for internet play. On one machine or a LAN 0.4 is safe -- every
# apply measured late=0 at 0.6. Below 0.4 a jitter spike lands a command in a
# peer's PAST, a desync rather than a delay, unless strict_barrier holds the
# sim for it. Set the SAME value on every instance.
#exec_delay=0.4

# speed_v2: one speed for the session (default ON). Each player's speed button
# is that player's CEILING; the session runs at the LOWEST one, so anyone can
# slow or pause everyone and the host's play-click overrides a stuck pause. A
# pause is a sync point: the leader stops at once and everyone behind runs to
# the leader's clock before stopping, so "pause to let people catch up" does
# exactly that. Set to 0 for the old v1 pacer (not recommended).
#speed_v2=1

# speed_auto: the automatic corrections on top of the levers -- a leader more
# than a unit ahead pulses speed 0, and a sustained spread steps the session
# down a notch. Off by default (2026-09-09): players felt the stutter and the
# throttling and could not see why. Commands are stamped past the fastest
# clock, so a gap costs the slower player latency on their own actions, not a
# desync; the hard barrier still stops a runaway leader.
#speed_auto=1

# PID pacing (speed_frac_pace=1, default on): the host runs the session speed
# as set; every joiner steers its clock to the HOST's by scaling the session
# speed through the dither (ahead: eases off; behind: up to pid_max x). The
# game script re-reads this file every ~5 s, so these can be tuned live; each
# decision that changes the target logs its P/I/D terms ("PID: e=...").
# Defaults shown. pid_dead is the dead band in game units; pid_min/max clamp
# the multiplier of the session speed.
#pid_kp=0.05
#pid_ki=0.015
#pid_kd=0.02
#pid_dead=0.30
#pid_min=0.70
#pid_max=1.20
#pid_slew=0.05
#speed_frac_pace=1

# cancel_construction: TRUE cancel-and-replay for constructions (depots, stations):
# the params are walked off the proposal at the click, the native build is
# cancelled, and every instance -- the originator included -- builds the
# scripted proposal at the stamp. Without it the originator keeps its native
# copy and conx_strict bulldozes and rebuilds it 0.6 s later (the flicker).
# Was a live-only line in the game-dir cfg until 2026-09-09, when a dev deploy
# overwrote it and constructions fell back to the flicker path; shipped since.
cancel_construction=1

# xing_reheight: when a replayed rail vertex lands on an existing road node at a
# different height, MOVE that node to the rail (the 2026-08-31 answer to "Too much
# slope"). Moving an existing node inside a replayed proposal asserted the engine
# and killed the game (2026-09-09), so this is OFF: the rail meets the road at the
# road's height, and a slope the engine refuses is refused identically everywhere.
#xing_reheight=1

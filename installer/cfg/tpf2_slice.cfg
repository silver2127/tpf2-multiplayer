# tpf2_slice.cfg -- switches for tpf2_slice.dll, which captures a player's own
# build or vehicle command, cancels it locally and hands it to lockstep so every
# peer applies it at the same game time. The DLL reads the copy next to itself
# (the game folder, where the installer puts this file) first, then
# %LOCALAPPDATA%\tpf2mp\data\, then built-in defaults. Lines whose first
# character is # or ; are comments. Every switch is on with =1 and off with =0,
# and the file is re-read on every event, so a change takes effect while the
# game is running.

# enabled: 0 makes the hook completely inert -- no capture, no inject, no cancel;
# the game behaves like plain single player.
enabled=1
# suppress: 1 cancels the player's own build locally after capturing it so it is
# applied only through lockstep (real multiplayer). 0 is observe-and-log: the
# build happens locally as normal AND is still replicated to the peer, which
# leaves the local player with a duplicate -- use 0 only for debugging.
suppress=1
# merge: 1 welds a replayed construction's template street onto the existing
# road it was snapped to on the originating game, so the geometry is identical
# on every peer. 0 leaves the replayed proposal exactly as shipped.
merge=1
# cancel_vehicle: 1 applies strict lockstep to the vehicle commands whose UI
# does not wait for a result (currently reverse-vehicle): the local command is
# cancelled and replayed at the shared time stamp, like a build. 0 runs vehicle
# commands locally at once and replicates them afterwards.
cancel_vehicle=1

# cancel_line: 1 makes assigning a vehicle to a line strict as well -- cancelled
# locally and applied at the shared stamp on every peer -- so a vehicle starts
# its line at the same sim step everywhere. 0 assigns at click time on the
# originator, which leaves that vehicle a fraction of a second ahead there.
cancel_line=1

# Diagnostic: dump every BuildProposal (nodes/segments/removals) to tpf2_slice.log.
# Off in shipped installs -- it is verbose. Set to 1 when investigating a replay
# that the engine rejects without a message; deploy_shipping.ps1 overwrites this
# file, which is how it silently got turned off mid-investigation (2026-08-30).
dumpprop=0

# conx_strict: EXPERIMENTAL. Fixes a station desync where the host's terrain
# grade -- and so the height of the station's track -- differs from the peers'.
# Cause: the host keeps its own native placement while every peer rebuilds the
# station through a scripted proposal, and the two grade the ground differently.
# With this on, the host bulldozes its own copy and rebuilds it the same way the
# peers do, so all instances match; the money is reconciled so you still pay
# once. Constructions that split a road (depots) are left on the native path --
# strict would heal the split and the rebuild would be refused, losing the
# building. ON by default: without it, placing a rail station desyncs the world
# immediately, which is worse than the residual risk that a failed rebuild loses
# that one construction. Set to 0 to keep the old behaviour.
conx_strict=1

# dump_egeo: writes egeo_<instance>.txt (every edge the desync hash sees) next
# to the game exe, for diffing two instances after a divergence. Diagnostic.
#dump_egeo=1

# strict_barrier: EXPERIMENTAL, and the real definition of lockstep. Without it
# the game happily simulates past a step whose command has not arrived yet;
# recovery then applies that command late, which is a genuine divergence that
# merely looks like a save. With it on, the sim STOPS while any command a peer
# says it issued is still missing, and resumes the moment it arrives (pausing
# helps -- the network keeps running while the sim is stopped). It holds through
# the same watchdog as the clock barrier, so a hole that can never be filled
# force-releases after ~11s rather than freezing the game. Off by default
# because tightening this barrier has deadlocked both games before; watch
# "outstanding=" in lockstep_status_<inst>.txt when trying it.
#strict_barrier=1

# road_demolish: replicate BULLDOZING a road or rail edge. Off by default.
#
# Until this existed the bulldozer was capture-only. Every other channel adds or
# edits, and the only removals that crossed the wire were constructions,
# vehicles, lines and stops -- so demolishing a ROAD was a silent local edit.
# The road vanished for the player who did it and stayed forever on every peer,
# which diverges the edge and height lanes on the spot. It reads as a lag
# artifact ("I demolished during lag and the crossing did not form") but lag
# only widens the window in which the player does it; it never replicated at
# any speed.
#
# With this set the bulldoze is CANCELLED locally and replayed from the wire at
# the agreed stamp, so every instance removes the road at the same game-time --
# the same architecture as roads, upgrades, vehicles and lines. The far end
# matches by endpoint POSITION and edge KIND, never by entity id, so a divergent
# id cannot bulldoze the wrong road.
#
# Off by default because a removal is not self-correcting the way an addition
# is: a road that fails to appear is a visible missing road, but a road removed
# on the wrong instance is destroyed work with nothing to rebuild it from. Set
# it on EVERY instance or not at all -- a peer without it ignores the command
# and keeps the road.
# Validated on the three-instance rig 2026-09-03: EXEC EDEMO ... success=true,
# including orphan-node removal. ON by default from here -- a demolish that
# does not replicate is an unconditional desync, which is worse than the risk
# this flag was hedging.
road_demolish=1

# strict_buy: cancel the player's vehicle PURCHASE and replay it at the agreed
# stamp, like every other command. Off by default.
#
# Without it the originator creates the vehicle entity at CLICK time while every
# peer creates it at the stamp, ~3 sim-steps later. That head start is permanent:
# measured 2026-09-03, the host's vehicles ran ahead of both peers with the gap
# plateauing near 37 m, while the two peers -- both replays -- stayed identical
# to each other. purchaseTime, key binding and batch targets were already made
# to agree; this is the timing that was left.
#
# Off by default because BuyVehicle is the ONE command with a recorded client
# crash when cancelled: the depot window waits for the new entity and cancelling
# it fire-and-forget asserted (2026-08-28). It is now cancelled the way the BUILD
# TOOL is instead -- the completion callback is fired first, and if it cannot be
# fired the buy is left to run rather than wedging the window. The slice ships
# ARMED=0 when it did not cancel, so a buy that ran natively is still skipped by
# the originator rather than applied twice.
#
# If a client crashes when buying a vehicle, this is the first thing to turn off.
# Set it on EVERY instance or not at all.
#strict_buy=1

# load_gate: hold the game at the loaded save until the other players are in.
# ON by default.
#
# Without it the first instance to finish loading starts simulating alone: the
# barrier deliberately will not hold against silence (correct once a session is
# running, wrong before one has started). Anything done in that window is
# captured, found to have no peer and DROPPED, while the native action still
# happens locally -- so a vehicle bought while the others were still loading
# exists on one instance and no other, and the setLine that follows has nothing
# to bind to on the peers.
#
# It WITHHOLDS the initial unpause rather than commanding speed 0, so it adds no
# new way to stop the simulation. Pressing play is a first-class override, and
# it gives up after K.LOADGATE_MAX_TICKS (~2.8 min) with a loud log rather than
# ever hanging a session.
#load_gate=0
#
# expect_players: how many players this session should have, INCLUDING you.
# With it set the gate waits for exactly that many; without it, it waits for at
# least one peer and then for the count to stop changing. Set it on a fixed rig.
#expect_players=3

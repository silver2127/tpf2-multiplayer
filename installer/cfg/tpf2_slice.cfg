# tpf2_slice.cfg -- optional settings for the multiplayer mod.
#
# Multiplayer needs no settings: everything it depends on is built in. The
# three keys below are for diagnosing a problem or tuning latency, and all of
# them are commented out. Remove the leading # to set one.

# dumpprop: the slice logs every build proposal (nodes, segments, removals) to
# tpf2_slice.log. Verbose; for a replay the engine rejects without a message.
#dumpprop=1

# dump_egeo: the mod writes egeo_<letter>.txt (every edge the desync hash
# sees), for diffing two instances after a divergence.
#dump_egeo=1

# exec_delay: how far ahead every command is stamped, in game-time units
# (0.2 to 5; 0.4 when unset). This is the felt latency of every action. Set
# the same value on every machine.
#exec_delay=0.4

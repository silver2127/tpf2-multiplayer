# tpf2_bigmap.cfg -- settings for the tpf2_bigmap plugin.
#
# Installed as <game>\plugins\tpf2_bigmap.cfg by the TpF2 Big Maps package and
# read by the tpf2mp plugin host, which merges it over tpf2mp.cfg (if any).
# Only the [tpf2_bigmap] section matters here. Same format as tpf2mp.cfg:
#   # or ;   comment, ONLY as the first non-blank character of a line
#   key=val  whitespace trimmed; keys case-insensitive, matched exactly
# Booleans take 1/0, true/false, yes/no, on/off.
#
# WHY A SEPARATE FILE: this plugin is shipped by its own installer, and so is
# the multiplayer mod. Two installers must never own one config file --
# uninstalling either would take the other's settings with it -- so each
# plugin carries its own. The installer replaces this file with the release
# settings on install, upgrade and repair, including edited older configs.

# ---------------------------------------------------------------------------
# tpf2_bigmap -- maps larger than the New Game menu offers.
# Ships in its own repository; this section is inert if the plugin is absent.
# ---------------------------------------------------------------------------
[tpf2_bigmap]

# Placement optimization attempts per worker batch: 200 = stock, 50 = fast.
# Fewer attempts can produce less even placement or fewer accepted sites.
# Map resolution, requested counts and feasibility checks stay unchanged.
placement_attempts=50

# Diagnose preview-to-world entry; logs time and memory for major phases.
world_entry_timings=1

# Experimental lossless material-index loop optimization for world entry.
material_index_fast=1

# Steam 35924, experimental: SSE2 terrain height refinement (the 4 m base
# heightmap to the 1 m/2 m height cache, every tile on world load and on
# terrain alignment). Bit-identical to stock by construction and by test
# (tools/test_terrain_refine.py); 0 = stock.
terrain_refine_fast=1

# Steam 35924, experimental: SSE2 tile min/max scan (the inlined
# CalcMinMaxHeight in terrain publication) plus a per-row memcpy for the
# uint16 height block copy 0x30a540. Bit-identical to stock by construction
# and by test (tools/test_terrain_minmax.py); anything that overlaps or is
# out of measured range falls back to the original. 0 = stock.
terrain_minmax_fast=1
# Steam 35924, experimental: pooled scratch and an SSE2 blend for terrain
# alignment (terrain_alignment_util::CalculateHeightMod, re-applies road, track
# and construction terrain cuts to each height-cache block on load and on every
# alignment update). Bit-identical to stock by construction and by test
# (tools/test_terrain_align_fast.py); 0 = stock.
terrain_align_fast=1


# Steam 35924: trim unused capacity from the tree and scenery instance lists
# of each 64 m cell while a new world is created, before the game keeps them
# for the whole session. Uses the game's own allocator; instance contents and
# order are unchanged. Saved games load through another path. 0 = stock.
instance_shrink=1

# Steam 35924, experimental: an in-game minimap that works on the largest maps.
# Adds a map button to the main toolbar through a GUI-only game script that the
# plugin writes to res\config\game_script\bigmap_minimap.lua (and deletes again
# when this is 0 or the plugin is uninstalled). The terrain picture is rendered
# natively and handed to the game as a texture, so its cost is the picture's
# pixel count, not the map size: no widget per pixel and no line limit. Towns
# and industries are clickable; click the map to move the camera. Pure UI: it
# cannot affect the simulation, saves or multiplayer. On since 0.5.2; 0 = no
# minimap.
minimap=1

# enabled=0 stops the host loading the DLL at all (checked before LoadLibrary,
# so a disabled plugin's DllMain never runs).
enabled=1

# ---------------------------------------------------------------------------
# MAP SIZE LADDER
# ---------------------------------------------------------------------------
# ONE TILE IS 256 m. tiles x 256 m = map size; heightmap px = tiles * 64 + 1.
# Values must be even; odd or oversized entries are clamped and logged.
#
# The game asks GetNumTilesNew for every (size dropdown 0..6, ratio dropdown
# 0..4) pair, so those two dropdowns are a 7x5 grid we can answer however we
# like. Claiming a whole ROW turns the ratio dropdown into a SIZE selector --
# a usable choice of map sizes without adding a single widget.
#
#     size<S>_format<F> = <tilesX>x<tilesY>
#
# Anything not listed falls through to the game's own function, so every other
# preset keeps its stock behaviour exactly.
#
# THE WART, stated plainly: the ratio dropdown still READS "1:1, 1:2, ..." while
# now selecting a size. That is NOT fixable from a mod, and the reason is worth
# recording so nobody retries it:
#
#   res/scripts/mod.lua:165  pGetText() resolves a mod string via
#       translateModStr(_currentModIdTr, _locale, id)
#   i.e. against the CURRENTLY EXECUTING MOD's own table only. A mod's
#   strings.lua can retranslate strings its own Lua asks for; it can never
#   reach a string the base game resolves. "1:1" is resolved by the C++ New
#   Game menu under the base catalog, so no mod is in scope when it is looked
#   up. (Verified: the msgids exist as '1:1'/'1:2'/'1:3' and 'map-size\x04
#   Megalomaniac' in res/strings/*/LC_MESSAGES/base.mo.)
#
# The only two real options are editing base.mo -- a GAME FILE, which Steam's
# verify-integrity reverts -- or a DLL hook on the text lookup. Neither is worth
# it for a cosmetic label, so the mapping lives here, in one visible place,
# rather than being hidden in the DLL.
#
# Megalomaniac (size 6) is LEFT VANILLA by default: the bigger sizes are the
# added rows further down, which overwrite nothing. The commented-out size6
# example below is the other option -- claim the Megalomaniac row and make its
# ratio dropdown an HONEST ratio selector: 1:1 is a big square, 1:2 a 2:1
# rectangle, and so on down to 5:1. GetNumTilesNew returns a CVec2i, so nx and
# ny are independent -- nothing here assumes a square. Uncomment and edit any
# cell to any <w>x<h> you like; odd or oversized values are clamped and logged.
#
#   ratio label   ->  tiles       km             area      peak RAM   status
#   1:1               320 x 320   81.9 x 81.9    6711 km2   16.4 GB   square; needs octree=1
#   1:2               448 x 224  114.7 x 57.3    6577 km2   16.1 GB   exact 2:1; needs octree=1
#   1:3               444 x 148  113.7 x 37.9    4307 km2   10.5 GB   exact 3:1; needs octree=1
#   1:4               448 x 112  114.7 x 28.7    3288 km2    8.0 GB   exact 4:1; needs octree=1
#   1:5               440 x 88   112.6 x 22.5    2538 km2    6.2 GB   exact 5:1; needs octree=1
#
# Peak RAM is the 2.500 MB/km2 law below x area (the game's own terrain-toolkit
# figure), NOT counting the ~4 GB the game itself uses. A long thin rectangle
# costs far less than the square of its long edge -- which is why the plugin
# checks the street-raster limit as a per-MAP product, not a per-axis cap.
#
# WANT THE OLD SQUARE SIZE LADDER? Set the five cells to
#   96x96 / 224x224 / 254x254 / 320x320 / 448x448
# and the ratio dropdown becomes a size selector again (labels then lie -- every
# rung is 1:1 -- which is the wart described above).
#
# ---------------------------------------------------------------------------
# THE 32,768 m WALL (measured 2026-09-06, the real ceiling until it is patched)
# ---------------------------------------------------------------------------
# On a 320-tile map (+-40,960 m) the street builder produces DUPLICATE base
# nodes -- 2 to 5 nodes at one position -- and every town-development or
# industry-connect step that touches one fails: "Base node deduplication
# failed" -> "Trying to delete duplicate node" -> assert
# transition_util.cpp:41 `ctx.size() >= 2` -> Internal error, 168 times in
# half an hour. Towns there never get streets, so they generate with ZERO
# population; terrain LOD is visibly wrong in the same band.
#
# All 21 duplicate positions have max(|x|,|y|) in [34,175 .. 40,082] m and NOT
# ONE is inside 32,768 m. All four edges equally. A 224-tile map (+-28,672 m)
# shows none of it.
#
# 32,768 = 2^15 = 256 tiles / 2, and it is ecs::OctreeSystem's root box: a
# two-tier CONSTANT (tiles<=128 -> +-16,384 m; >128 -> +-32,768 m), never
# derived from the map. Inserts never test containment; queries prune on node
# boxes first; so nodes past ~32,832 m are invisible to lookups and the street
# builder stacks new ones on top. Found and byte-verified 2026-09-06 -- see
# octree= below for the fix. Every RVA is in the plugin source.
#
# THE MEMORY LAW: generation peak is 2.500 MB per km2, plus ~4 GB for the game
# itself. That is not a guess -- the game prints it. Three sizes spanning 11x:
#
#   "* Terrain toolkit used 10 maps and 1510 MB..."     604 km2 -> 2.500 MB/km2
#   "* Terrain toolkit used 10 maps and 8221 MB..."    3288 km2 -> 2.500 MB/km2
#   "* Terrain toolkit used 10 maps and 16778 MB..."   6711 km2 -> 2.500 MB/km2
#
# (in <userdata>\1066780\local\crash_dump\stdout.txt). Linear in AREA, so it
# quadruples every time you double the map's edge. Budget for it before you
# generate: this is a transient peak during "Creating terrain", not steady state.
#
# THE STRUCTURAL CEILING IS 722 TILES (184.8 km). The heightmap is
# (tiles * 64 + 1) px per side, and at 724 tiles the PIXEL COUNT reaches
# 2,147,488,... > INT_MAX. NOTE this one is COMPUTED, NOT MEASURED -- it assumes
# the heightmap is indexed the same 32-bit way the street raster was
# (RVA 0x90d410), which is the same bug class but has not been confirmed on this
# structure. Do not trust it until something actually generates near it.
#
# Sizes above 180 tiles need street_raster=1 below, or the stock 1 m street
# raster overflows int32 and generation aborts. The plugin warns if you ask for
# one without it.
#
# ---------------------------------------------------------------------------
# BEFORE YOU ADD size4_* OR size5_* CLAIMS -- READ THIS
# ---------------------------------------------------------------------------
# The detour receives the RAW COMBO INDEX, not the preset-table key, and the two
# are not the same. At 0x140674b2f the engine checks experimentalMapSizes
# (GlobalSettings+0x2fc) and keys the table on sizeIndex when it is SET but on
# sizeIndex+1 when it is CLEAR. With the flag clear the size dropdown is short,
# so a size4_/size5_ claim would land on a DIFFERENT, STOCK preset than you
# intended -- silently redefining a normal map.
#
# The size6 example below is safe from this because size 6 is not reachable at
# all unless experimentalMapSizes is on. Claiming 4 or 5 is a real option, but it
# MUST be gated on that flag in Detour() first. Do not add those rows until the
# guard is in. (The ADDED rows further down need no such guard: they are matched
# by their position after the stock rows, whichever list is showing.)
#
# Uncomment all five to take Megalomaniac over with the ratio ladder:
#size6_format0 = 320x320
#size6_format1 = 448x224
#size6_format2 = 444x148
#size6_format3 = 448x112
#size6_format4 = 440x88

# ---------------------------------------------------------------------------
# ADDED SIZE LADDER (add_size_rows=1) -- fills the gap the game leaves
# ---------------------------------------------------------------------------
# The stock game builds at most 224 x 224 tiles (57 x 57 km, and only via the
# settings.lua override; the menu's own biggest preset is far smaller). This
# plugin's ceiling is 512 tiles (131 km) -- the octree limit. With
# add_size_rows=1 the plugin APPENDS new entries to the size dropdown (it does
# NOT overwrite any vanilla preset) that step across that gap, each LABELLED BY
# ITS km SIZE, no name. They sit after the stock sizes: after "Megalomaniac" with
# experimental map sizes on, after "Very Large" with it off.
#
# Each row is a SQUARE (its size<N>_format0 cell), labelled by that square. The
# ratio dropdown shapes it the way the game's own presets are laid out: 1:k keeps
# about the square's area -- short side = side / sqrt(k) to an even tile count,
# long side = k times that -- with the long side capped at max_tiles (512 with
# octree=1), so the biggest rows' narrow shapes come out smaller. Set any
# size<N>_format<F> cell yourself to override that one shape. Rows are size index
# 7..18, contiguous, and the label is <=15 chars.
#
# LABELS USE THE GAME'S OWN km. The New Game page shows a size as tiles / 4 km
# (Megalomaniac 1:1, 96 tiles, reads "24 km"), so a row labelled the same way
# agrees with what the page says once it is picked. The true edge is
# tiles x 256 m, 2.4% more.
#
#   label           tiles       true km        area       peak RAM
#   "32 x 32 km"    128 x 128    32.8 x 32.8    1074 km2     2.6 GB
#   "40 x 40 km"    160 x 160    41.0 x 41.0    1678 km2     4.1 GB
#   "48 x 48 km"    192 x 192    49.2 x 49.2    2416 km2     5.9 GB
#   "56 x 56 km"    224 x 224    57.3 x 57.3    3288 km2     8.0 GB  (stock engine ceiling)
#   "64 x 64 km"    256 x 256    65.5 x 65.5    4295 km2    10.5 GB
#   "80 x 80 km"    320 x 320    81.9 x 81.9    6711 km2    16.4 GB
#   "96 x 96 km"    384 x 384    98.3 x 98.3    9664 km2    23.6 GB
#   "112 x 112 km"  448 x 448   114.7 x 114.7  13153 km2    32.1 GB
#   "128 x 128 km"  512 x 512   131.1 x 131.1  17180 km2    41.9 GB  (our ceiling)
#
# Peak RAM is 2.500 MB/km2 x area (the game's own terrain-toolkit figure), NOT
# counting the ~4 GB the game itself uses. The top rungs are enormous -- watch
# that number before you generate. The bottom rungs start just above the biggest
# square the vanilla menu offers (Megalomaniac 1:1 = 96 tiles, "24 km"); 224
# tiles is the engine's own hard ceiling, reachable in stock only via the
# settings.lua override. Add or remove rungs freely (size7..18, each needs
# size<N>_format0 and a size_label<N>).
size_label7 = 32 x 32 km
size7_format0 = 128x128
size_label8 = 40 x 40 km
size8_format0 = 160x160
size_label9 = 48 x 48 km
size9_format0 = 192x192
size_label10 = 56 x 56 km
size10_format0 = 224x224
size_label11 = 64 x 64 km
size11_format0 = 256x256
size_label12 = 80 x 80 km
size12_format0 = 320x320
size_label13 = 96 x 96 km
size13_format0 = 384x384
size_label14 = 112 x 112 km
size14_format0 = 448x448
size_label15 = 128 x 128 km
size15_format0 = 512x512

# add_size_rows: 1 appends the size7..15 rows above to the vanilla size dropdown,
# after the stock sizes, with experimental map sizes ON or OFF (with it on they
# follow "Megalomaniac", with it off "Very Large"). One hook on the combo builder,
# acting only for the size dropdown's own call site, byte-verified; Steam 35924
# only (the GOG build skips it). 0 = the stock dropdown.
add_size_rows=1

# newgame_density: 1 adds six density levels after "Very high" in the stock
# Towns, Number of industries and Industry density target dropdowns: x0.50, x0.30,
# x0.18 (Megalomaniac's counts at 56 km), x0.10, x0.046 (112 km) and x0.022
# (160 km), each a scale on the stock Medium. The stock levels and the Medium
# default are untouched.
#
# The labels and the industry multipliers are added to the game's
# res\config\base_mod.lua, patched on every start (anchored inserts on the stock
# text, the stock file kept beside it as base_mod.lua.bigmapbak; nothing written
# when already patched, a game update re-patched, a file whose shape changed left
# alone with the levels off). Towns are applied natively: the Towns switch in the
# New Game params refresh is redirected to a stub that knows the new levels.
# 0 puts the stock file back on the next start. Steam 35924 only.
#
# A save made with an added industry level needs this plugin wherever it is
# loaded, by every player of a multiplayer game on it too: the stock runFn has no
# multiplier past Very high. Before removing the plugin, set Number of industries
# back to a stock level -- the page remembers the choice.
newgame_density=1

# Legacy single-cell override, kept so older configs keep working. The ladder
# above wins wherever both name the same cell. 0 = unused.
tiles_x=0
tiles_y=0

# Upper bound the plugin will honour, so a typo cannot ask for an absurd size.
# The game's own 224 clamp is NOT a limit for us -- the detour returns before it
# ever runs -- so this is the only thing standing between a fat-fingered config
# and a map that eats the machine.
#
# 512 is the default octree ceiling. Experimental octree_depth=12 allows
# 1024-tile edges; octree_depth=13 allows 2048-tile edges, both retaining
# 128 m leaf cells. Heightmap pixel products
# above INT_MAX are reduced (a 1024-square map does not fit). WITHOUT
# street_raster=1 the square ceiling is 180 tiles: past
# that the stock 1 m street raster overflows int32 mid-generation. WITHOUT
# octree=1 it is 256.
max_tiles=2048

# Log every size lookup. Cheap (it fires when the menu recomputes, not per
# frame) and it is how you confirm the hook is live before generating anything.
log=1

# street_raster: scale the street-generation occupancy raster's cell size with
# map size. The stock raster is ONE BIT PER SQUARE METRE over the whole map
# bounding box, sized by a 32-bit multiply (RVA 0x90d410) -- 56 km needs
# 3.14e9 cells, which overflows INT_MAX and aborts generation with an uncaught
# std::length_error.
#
# Widening that multiply would NOT be a fix: nx/ny are int32 and every access
# computes y*nx+x, so a correctly sized vector would still be indexed with
# wrapped values past 2^31 -- silent corruption instead of a clean abort.
# Coarsening the grid shrinks nx/ny themselves, so nothing downstream changes.
#
#   24 km (stock) : 1 m -> 0.58e9 cells   untouched, no behaviour change
#   56 km         : 2 m -> 0.78e9 cells   392 MB -> 98 MB
#   112 km        : 3 m -> 1.39e9 cells
#
# This is a no-op below the budget, so leaving it on costs nothing on normal
# maps. Turn it off only to reproduce the overflow.
street_raster=1

# Cell budget in millions. The hard wall is INT_MAX (2147) for the allocation,
# but downstream indexing is int32 too, so the default leaves real headroom
# rather than sitting just under the cliff.
cell_budget_millions=1500

# octree: widen the engine's spatial-index root box from +-32,768 m to
# +-65,536 m (depth 10 -> 11) so maps over 256 tiles stop growing duplicate
# street nodes near the edge. A 13-byte in-place rewrite at RVA 0x2304f8 (the
# sole Octree::Resize call for the >128-tile tier), byte-verified before it is
# written; the shared 32768.0f constant in .rdata is NOT touched.
#
# Depth 11 caps the original int32 node-ID scheme, so the default ceiling is
# 512 TILES (131 km). The experimental depth-12 mode below replaces leaf IDs.
# The
# leaf stays 128 m, so query behaviour is unchanged; cost is one extra tree
# level. Applied ONLY when some configured size exceeds 256 tiles -- a stock
# or 254-tile setup never sees it.
#
# NOT YET VERIFIED at depth 11: the renderer's per-level skip vector sizing.
# The first 320-tile map generated with this on is the test: no "Duplicate
# base nodes found" on reload, towns near the edge get streets, and nothing
# odd at the map edge in the renderer. If the edge renders wrong with this ON
# and right with it OFF, that vector is sized by a constant -- report it.
#
# Does NOT repair an existing 320-tile save: its duplicates are already in the
# file, and the game's own load-time merge fails on them. Regenerate.
octree=1

# EXPERIMENTAL: 12 enables actual depth 12 and a +-131072 m root;
# 13 enables depth 13 and +-262144 m. Both keep 128 m leaves.
# Edge capacities: 1024 tiles / 262.144 km, or 2048 tiles / 524.288 km.
# Steam 35924 only. Requires max_tiles=1024 or 2048, respectively,
# and a larger size<S>_format<F> entry to offer larger
# maps. This option applies at load even if the menu's configured sizes are small.
# Keep it enabled whenever loading a world made for the larger root; multiplayer
# participants need matching patches/settings. Save/load and live rendering of
# larger worlds are NOT yet validated. See docs/octree-depth12.md.
# 11 retains the existing behavior. Only 11, 12 and 13 are accepted.
octree_depth=13

# 0 preserves saved/default resolution; 1 restores stock 1 m on load.
# The old 2 m experiment is discontinued after rendering/construction failures.
terrain_cache_spacing_m=1

# Experimental LOSSLESS 1 m cache compression, Steam 35924 / Windows 10 1803+.
# Requires terrain_cache_spacing_m=1. Cold tiles retain every height sample;
# they restore on access at the same virtual address. Restart to enable/disable.
# hot_mb is the resident target (128..8192), excluding compressed cold storage.
# Busy/incompressible tiles can exceed it. No save-format or octree changes.
terrain_cache_compress=1
# Measured 2026-09-15 on a 256x256 map: a moving/zoomed-out camera keeps
# 24-34k terrain tiles (3-4.3 GiB) in use, so a 1024 MiB target was never
# reached and only caused ~3,000 decode/unmap cycles per second (stutter).
# hot_mb 0 and warm_mb -1 size both targets from installed RAM (hot ~RAM/30,
# clamped 256..4096 MiB; warm ~RAM/12, clamped to hot..8192 MiB; the material
# pager uses RAM/180 and RAM/48). Explicit values override. warm_mb 0 disables
# the loading allowance.
# Once a world is loaded the target does not snap to hot_mb: it drops by at
# most 1/16 per second, holds or grows while the engine keeps faulting
# evicted tiles back in, and drifts back toward hot_mb when the working set
# fits. The ceiling is hot_mb plus 3/4 of the room (free RAM plus what the
# pager holds) above a reserve of a quarter of that room or the machine's
# headroom (RAM/7, 2..12 GiB), whichever is larger; free RAM under the
# headroom shrinks the target by 1/8 per second. hot_mb is the floor.
terrain_cache_hot_mb=0
# Temporary resident target during generation or bulk tile allocation (0..8192).
# Kept through late loading until a fresh gameplay UI frame (matching menu DLL).
# Old menu DLL fallback: 3 minute tail. Disabled below 8 GiB available RAM.
# Set 0 to disable the temporary allowance.
terrain_cache_warm_mb=-1
# Cap on the resident 1 m tile target, in MiB. 0 = automatic: a quarter of RAM
# clamped to 4096..8192 (16 GiB: 4096; 32 GiB and up: 8192), the same size on
# every machine that can afford it. -1 = no cap: the policy above then fills
# RAM down to the machine's headroom while the engine keeps re-reading tiles.
# A cap is paid with decodes (about 0.2 ms each); watch `cold restores/s` in
# the log, at 300 or more it is costing frames (a 4096 cap did, on a freshly
# generated big map, 2026-09-20). Most of a big map's memory is the engine's
# own -- 15 GiB before the pager held a byte -- and no cap here changes that.
# hot_mb stays the floor.
terrain_cache_max_mb=0
# Ceiling on evictions per second while nothing is loading and the commit
# charge is not tight (0 = unlimited). Each eviction is a protection change,
# an encode and an unmap; draining a loaded world at several thousand per
# second made the game stutter even from background threads (measured
# 2026-09-17). The rate actually used adapts below this ceiling: evictions
# get a quarter of one core (their measured cost sets the cap, so a slow
# machine evicts less and a fast one more), and any gameplay frame of 60 ms
# or more halves the rate for a while (needs the multiplayer menu DLL for
# the frame signal). Loading bursts and a tight commit charge ignore it.
terrain_cache_evict_per_s=4000

# EXPERIMENTAL, MEASUREMENT STAGE: share the height-cache section between the
# two CTerrain versions instead of copying it. Loading a save briefly holds both
# versions -- 131,072 tile buffers on a 256x256 map, 16.5 GiB -- because the
# copy-on-write hook memcpys every resident tile into a fresh slot. With this on
# the second version maps the SAME section at its own address; both views go
# read-only and whichever version is written first gets a private copy.
#
# The saving depends entirely on how many tiles are actually written while both
# versions exist, which has never been measured. The 30 s log line reports
# cow_shared / cow_privatized: a privatized count near the shared count means
# sharing only defers the copy and this should go back off. Shared tiles are not
# evicted while shared, so they compress only after they privatize or one
# version is released. 0 = the stock eager copy.
terrain_cow_share=0

# MEASUREMENT ONLY: hash every live terrain tile and log how many are
# byte-identical to another (every 10 s while loading, every 2 min otherwise).
# Decides whether content dedup between the two CTerrain versions of a save
# load is worth building: both allocate 65,536 tiles each on a 256x256 map from
# the same save data. Costs a few seconds of one background thread per probe;
# changes nothing. Read the "terrain dedup probe:" lines in tpf2mp_host.log.
terrain_dedup_probe=0

# Content dedup of terrain tiles (Steam 35924, needs terrain_cache_compress=1).
# MEASURED 2026-09-17 on a 256x256 save load: for the whole time both CTerrain
# versions exist, every one of the 131,072 tiles has exactly one byte-identical
# twin in the other version (64,922 pairs at 131,072 live, 719 still unfilled),
# and after the load the surviving 65,536 are all distinct. With this on, an
# eviction whose bytes match a blob already stored shares that blob instead of
# encoding it again: the second twin of each pair costs a hash instead of an
# encode, and the compressed copy is kept once. Two independent 64-bit hashes
# must agree before anything is shared. 0 = every eviction encodes.
terrain_dedup=1

# Fresh terrain tiles start without memory behind them. Measured 2026-09-17:
# a save load allocates every tile of both versions first, all zero (112,678
# of 131,072 still zero at one probe), and fills them over the next 20-30 s;
# a section per allocation committed up to 27 GiB before any terrain existed,
# faster than eviction could shed it, and the commit charge hit the limit
# (the game's own "Out of memory" assert). With this on a tile gets its
# section on the first touch instead, so commit follows the fill. 0 = a
# section per allocation, as before.
terrain_lazy_zero=1

# The terrain alignment pass at load computes a 257x257 work block for every
# tile and keeps all of them until the publication pass has copied each into
# its tile (measured 2026-09-17 with an allocation trace: 99,014 blocks,
# 19.2 GiB, plus 37,354 alignment result vectors, 6.7 GiB, all alive at the
# moment the game ran out of memory). With this on both go through the
# small pager (page-granular spans: reserved on allocation, committed on the
# first touch, compressed and decommitted when over budget, restored on the
# next access), and their release is caught at the CRT free import. Measured
# 2026-09-17 on a second map (LONGBOI): 3.3 million result vectors and ~10
# million work vectors of ~16 KB, the game's own 34 GiB private peak.
# Needs terrain_cache_compress=1. Superseded by alignment_batch_tiles below,
# which keeps the live set to one batch and makes this cost only (three
# system calls per block, ~13 million blocks on that map): off by default,
# kept as the fallback for a build where batching is off. 0 = heap.
terrain_blocks=0
# Resident budget of the small pager in MiB. Deliberately no loading
# allowance (measured 2026-09-17: with one it kept 26.7 GiB of blocks
# resident during the load, the very peak it removes); under a tight commit
# charge it drains to 64 MiB. Raise it on a machine with commit to spare to
# keep more blocks resident and shorten the publication pass.
small_cache_hot_mb=1024

# EXPERIMENTAL (Steam only): lossless paging of the terrain renderer's
# material-index cells. The game keeps one 67,601-byte cell per tile for the
# whole session (measured 4.13 GiB on a 256x256 map); cold cells are kept
# compressed (~20% of raw) and restored on access at the same address.
# Panning and terrain edits restore cells; a full repaint restores all of them.
# hot_mb: resident target (64..8192). warm_mb: temporary target during
# generation or bulk allocation (0..8192). Restart to enable or disable.
material_cache_compress=1
material_cache_hot_mb=0
material_cache_warm_mb=-1
# RIG-ONLY: pretend the machine has this much RAM, in MiB (0 = off). The pager
# policy (thresholds, headroom, caps, budgets) then sizes itself for that
# machine, with free RAM and free commit scaled to the fractions the real
# machine shows. The engine is not constrained. 32768 tests a 32 GiB PC here.
simulate_physical_mb=0
# Cap on the resident material-cell target, in MiB. 0 = automatic: a quarter
# of the terrain cap (2048 on 32 GiB or more). -1 = no cap.
material_cache_max_mb=0
# Same ramp-down, hold-on-faults and adaptive eviction rate as the terrain
# cache (measured 2026-09-17: the old snap evicted 93,000 cells in 30 s).
material_cache_evict_per_s=4000

# Steam New Game map ratios, 1:1 through 1:N (5..20). 20 adds 1:6..1:20.
# Extra ratios work with stock and added size rows. Area is approximately kept
# until max_tiles, octree extent or heightmap element count requires shrinking.
# Optional explicit cells use size<S>_format<F>, F=ratio denominator minus 1.
max_ratio=20

# Steam 35924: zstd level 1 instead of 3, 64 KiB save input buffer instead
# of 128 bytes. Applies to automatic and manual saves; files may be larger.
# Serialization and save format are unchanged. 0 restores stock on restart.
save_fast=1

# Steam 35924: the travel-time limits of the urbansim, in game seconds
# (730 s = one game year at 1x; the stock values are 20 and 100 minutes).
#   travel_time_limit_s  stock 1200: the "stations reachable within the
#                        limit" search for every cargo type, passengers
#                        included, and people's own path and destination
#                        choice. A cargo type only sees consumers whose
#                        station it can reach within this.
#   cargo_path_time_s    stock 6000: the longest path the path builder will
#                        give a cargo item, and the stock-list target picker.
# 0 keeps stock; other values are clamped to 60..86400. Two 4-byte data
# cells, byte-verified before the rewrite. Gameplay changes: longer trips
# become acceptable to people and cargo, so demand spreads further.
travel_time_limit_s=0
cargo_path_time_s=0

# Steam 35924: the terrain alignment update runs in batches of this many
# tiles. In play the engine updates the few tiles a build touched, computing
# every road/track/construction cut on the thread pool and then publishing
# them into the height cache. On a save load it does the same for the WHOLE
# map in one call, holding every intermediate block until the end: measured
# 2026-09-17 on a 207,360-tile map, 3.3 million result vectors and ~10
# million work vectors alive at once, the game's own 34 GiB private peak and
# an "Out of memory" assert on a 94 GiB machine with no page file. With this
# set, one call of the whole map becomes calls of N tiles (compute, publish,
# free per batch), which is the per-frame behaviour the engine already has.
# Byte-verified; the game's own tile set is walked read-only and never
# modified. 0 = stock (one call).
alignment_batch_tiles=512

# Terrain sidecar: serve a save's finished 1 m height cache on load.
# A sidecar file written beside the save holds the aligned cache; when it
# matches the save being loaded, every tile it holds is decoded into the
# tile the moment CTerrain::AddTile creates it, and the load's refine and
# alignment publication into that tile are skipped (the sidecar IS that
# result). Tiles the file lacks, and any save without a matching file, load
# stock. Needs terrain_cache_compress=1 (the tile arena carries the mark).
# 0 = never apply a sidecar.
terrain_sidecar=1

# Write the sidecar. 1 = every save gets "<save>.terr" beside it: the terrain is
# captured at the start of the save (the world is frozen for its length), and the
# file is stamped with the finished .sav's hash and renamed into place when the
# engine returns. A load finds its sidecar by that hash, so a COPY of the save
# under another name (multiplayer's mp_shared.sav) uses it too. A sidecar whose
# .sav is gone (a rotated autosave) is deleted at the next write. Costs save time
# and disk (about a fifth of the raw 1 m cache). 0 = read sidecars, never write.
terrain_sidecar_write=1

# Optional size limit: no sidecar for a map with more grid records (tiles) than
# this. The capture is
# about 0.17 ms and 23 KiB per tile, on EVERY save, autosaves included:
#     8,712 tiles   1.5 s   190 MiB        65,536 tiles (256 x 256)   11 s   1.4 GiB
# 0 = no limit (the default: a big map's saves take longer and its loads are
# what the sidecar is for). Set a number to skip the sidecar above that size.
terrain_sidecar_max_tiles=0

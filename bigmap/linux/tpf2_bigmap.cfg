[tpf2_bigmap]
enabled=1
add_size_rows=1
newgame_density=1
max_ratio=20
max_tiles=512
street_raster=1
cell_budget_millions=1500
octree=1
# 11 = stock-ID depth, 512-tile edges. 12/13 match the Windows plugin
# (1024/2048-tile edges); every peer must use the same octree_depth.
# Upstream reports successful play/save/reload and native dedicated multiplayer
# at depth 13 (2026-09-23); see docs/linux/PORT.md for evidence and native limits.
octree_depth=11
# Exact terrain scan and faster zstd saves (save files may be larger).
terrain_minmax_fast=1
save_fast=1
# Lossless RAM compression defaults on; set 0 after SIGBUS (see INSTALL.md).
terrain_cache_compress=1
# Soft budget for uncompressed terrain, not total game RAM.
# 0 = dynamic live-tile budget with available-RAM headroom and a 4..8 GiB cap.
# Positive values fix the budget in MiB (128..16384).
terrain_cache_hot_mb=0
# Windows commit_tight_mb has no native effect: this pager uses MemAvailable,
# not Windows free commit. Its RAM headroom remains RAM/7, bounded to 2..12 GiB.
# Experimental load batching; awaiting live lifetime validation. 0 = stock.
# Use 512 for a controlled lab trial.
alignment_batch_tiles=0
# Terrain sidecar: "<save>.terr" beside each save holds every tile's height
# cache; loading that same save restores the tiles from it and skips the
# alignment pass. 0 = neither written nor read.
# On by default from 0.7.1.2 (the user's decision, 2026-09-28): its first game
# use is the project's dedicated server. Live terrain lifetime and load
# completion were verified statically and in tests only; set 0 if it misbehaves.
terrain_sidecar=1
# 0 = read sidecars but do not write them on save.
terrain_sidecar_write=1
# Threads that compress the sidecar during a save. 0 = CPUs-1, at most 8.
terrain_sidecar_threads=0
# Terrain stream (docs/terrain-stream.md): a multiplayer joiner receives the
# host's sidecar while its game loads and uses what has arrived; the alignment
# pass waits for the rest only when that is faster than computing it.
# 0 = never use a streamed sidecar.
terrain_stream=1
# Test switch: 0 = ignore sidecars beside the save and use only a stream (a
# second instance on the host's PC sees the host's save folder).
terrain_sidecar_read_local=1
# 1 = decode the sidecar's tiles in parallel at the alignment pass instead of
# one by one on the load's thread as each tile is added. Requires terrain_sidecar=1;
# the native pass wrapper works with alignment_batch_tiles=0 too. Speedup is unmeasured.
terrain_sidecar_decode_at_pass=1
# Optional replacement for a stock menu cell (tiles are 256 m each):
# tiles_x=224
# tiles_y=224
# size_index=6
# format_index=0
# Or explicit cells: size7_format0=128x128, size_label7=Custom

# Automatic Fantasia buffer reuse above 32768 squared metres; no extra mod.
generator_memory=1
# Percent of MemAvailable for generation buffers (default 50, capped at 90).
# Strict overcommit also caps by commit headroom. 0 = fewest buffers.
generator_memory_budget_pct=50

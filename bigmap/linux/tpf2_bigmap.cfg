[tpf2_bigmap]
enabled=1
add_size_rows=1
newgame_density=1
max_ratio=20
max_tiles=512
street_raster=1
cell_budget_millions=1500
octree=1
# 11 = stock-ID depth, 512-tile edges. Experimental 12/13 match the Windows
# plugin (1024/2048-tile edges); every peer must use the same depth.
octree_depth=11
# Exact terrain scan and faster zstd saves (save files may be larger).
terrain_minmax_fast=1
save_fast=1
# Lossless RAM compression defaults on; set 0 after SIGBUS (see INSTALL.md).
terrain_cache_compress=1
# Soft budget for uncompressed terrain, not total game RAM.
# 0 = dynamic live-tile budget with available-RAM headroom and a 4..8 GiB cap.
# Positive values fix the budget in MiB (128..16384).
terrain_cache_hot_mb=0
# Experimental load batching; awaiting live lifetime validation. 0 = stock.
# Use 512 for a controlled lab trial.
alignment_batch_tiles=0
# Optional replacement for a stock menu cell (tiles are 256 m each):
# tiles_x=224
# tiles_y=224
# size_index=6
# format_index=0
# Or explicit cells: size7_format0=128x128, size_label7=Custom

# /etc/sysctl.d/99-tpf2mp.conf -- kernel limits a TpF2 dedicated server needs.
# setup_vps.sh installs this file; `sysctl --system` applies it, and it survives a
# reboot (a plain `sysctl -w` does not).

# A big world maps a great deal: the terrain pager's arena, and -- on the native
# Linux build -- lavapipe's per-frame buffers, which sit in a memfd as tens of
# thousands of separate mappings (48,000 of them, 1.26 GiB, measured on the test
# server with a 49,000-tile map). The default 65,530 is reached by such a process,
# and an mmap that fails there is a crash, not a slow frame.
vm.max_map_count = 1048576

# The game's pages are all hot: the simulation walks the whole world every step.
# Swapping them out to reclaim page cache costs far more than the cache is worth,
# so lean on the cache first and only swap under real pressure.
vm.swappiness = 10

# Builds TpF2Multiplayer.msi and the Proton/manual-install files zip the way a
# release does: installer\build_msi.ps1 (native DLLs, the frozen lobby, the
# custom-action DLL, wix build, then an administrative-install validation), then
# tools\build_files_zip.py. Every push to dev/main and every pull request gets the
# artifacts; a v* tag also gets a GitHub release with them attached.
#
# The runner's Visual Studio is found through vswhere (tools\msvc_env.bat), so no
# Build Tools path is assumed. WiX v7 is installed as a .NET global tool; passing
# -AcceptWixEula means the repository owner accepts the WiX Open Source
# Maintenance Fee terms (https://wixtoolset.org/osmf/) for CI builds.
name: Build MSI

on:
  push:
    branches: [dev, main]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: write   # release upload on tags; read-only is enough for everything else

concurrency:
  group: msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msi:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: netpunch/requirements.txt

      - name: Python packages (lobby freeze)
        # PyInstaller with its bootloader compiled here, not the stock stub every
        # antivirus signature knows (tools/pyinstaller_from_source.py)
        run: |
          python tools\pyinstaller_from_source.py
          pip install -r netpunch\requirements.txt

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: WiX Toolset v7
        run: |
          dotnet tool install --global wix
          wix --version

      - name: Build the MSI
        run: powershell -ExecutionPolicy Bypass -File installer\build_msi.ps1 -AcceptWixEula -Validate

      - name: Build the files zip (Proton / manual install)
        run: python tools\build_files_zip.py

      - name: Checksums
        shell: pwsh
        working-directory: installer/out
        run: |
          Get-FileHash TpF2Multiplayer.msi, TpF2Multiplayer-files.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Copy-Item ..\..\tools\proton\install.py install_proton.py

      - uses: actions/upload-artifact@v4
        with:
          name: TpF2Multiplayer-${{ github.sha }}
          path: |
            installer/out/TpF2Multiplayer.msi
            installer/out/TpF2Multiplayer-files.zip
            installer/out/install_proton.py
            installer/out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/out/TpF2Multiplayer.msi
            installer/out/TpF2Multiplayer-files.zip
            installer/out/install_proton.py
            installer/out/SHA256SUMS.txt
          draft: true
          generate_release_notes: true
